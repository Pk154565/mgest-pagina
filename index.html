<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>M Gest — il programma</title>
<!--
  M Gest — PAGINA ONLINE, solo da guardare (versione 2, 7/11/2026).
  La pagina sta qui (GitHub Pages) e chiede i dati allo script di Google («magazzino», Codice.gs) SENZA i cookie di
  Google: così, con più account Google nel browser, Google non infila «/u/2/» e non dà «Impossibile aprire il file».
  Qui dentro NON ci sono dati né indirizzi: l'ID dello script sta dopo il # del link (…/index.html#AKfy…), e il # non
  viene mai mandato a GitHub. I dati arrivano solo col PIN giusto o col «ricordami».
-->
<style>
:root{--sf:#f4f1ea;--sc:#ffffff;--tx:#1d1d1b;--deb:#6b6b66;--li:#d9d4c7;--ac:#C46F1F;--ac2:#fbe9d7;--ve:#1E8449;
  --ro:#b03a2e;--gi:#f6d860;--ogg:#C46F1F;--fuori:#ebe7dd;--ora:#e8e3d7}
@media (prefers-color-scheme:dark){:root{--sf:#111110;--sc:#1c1c1a;--tx:#ecebe6;--deb:#a3a29b;--li:#34332f;--ac:#E08A3A;
  --ac2:#3a2a1a;--ro:#ff7b6b;--fuori:#171716;--ora:#2a2926;--ve:#5cd08a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sf);color:var(--tx);font:16px/1.35 -apple-system,"Segoe UI",Roboto,sans-serif;
  -webkit-text-size-adjust:100%}
button{font:inherit;color:inherit}
.b{border:0;border-radius:8px;padding:9px 13px;background:var(--ac);color:#fff;font-weight:700;font-size:14px;cursor:pointer}
.b.gr{background:transparent;color:var(--tx);border:1px solid var(--li)}
.deb{color:var(--deb);font-size:14px}
.err{color:var(--ro);font-weight:600}
header{position:sticky;top:0;z-index:5;background:var(--sf);border-bottom:1px solid var(--li);
  padding:8px 16px calc(8px);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
header h1{font-size:18px;margin:0;flex:1 1 0;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .deb{flex-basis:100%;order:3}
@media (max-width:440px){header .b{padding:8px 9px;font-size:13px}header h1{font-size:16px}}  /* 8/11: tre pulsanti in una riga */
main{max-width:1100px;margin:0 auto;padding:0 16px 40px}
/* l'ingresso */
#porta{max-width:420px;margin:40px auto;text-align:center}
#porta input[type=password]{font-size:26px;padding:10px;width:9em;text-align:center;letter-spacing:6px;border:1px solid var(--li);
  border-radius:10px;background:var(--sc);color:var(--tx)}
#porta label{display:block;margin:14px 0}
/* gli avvisi */
#avvisi{margin:10px 0}
#avvisi summary{cursor:pointer;font-weight:700;padding:6px 0}
#avvisi p{margin:4px 0;font-size:14px}
/* il calendario */
.sett-testa{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;position:sticky;top:var(--alto,58px);z-index:4;
  background:var(--sf);padding:6px 0;font-size:12px;color:var(--deb);text-align:center;font-weight:700}
.mese{font-weight:800;font-size:15px;margin:16px 0 6px}
.sett{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:4px}
.g{background:var(--sc);border:1px solid var(--li);border-radius:8px;min-height:78px;padding:4px;cursor:pointer;overflow:hidden;
  display:flex;flex-direction:column;gap:2px;text-align:left}
.g.fuori{background:var(--fuori);color:var(--deb);cursor:default;border-color:transparent}
.g.oggi{border:2px solid var(--ogg)}
.g .n{font-weight:800;font-size:14px}
.g.oggi .n{color:var(--ogg)}
.g .pz{font-size:12px;line-height:1.25;border-radius:4px;padding:1px 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
  border:1px solid rgba(0,0,0,.15)}
.g .piu{font-size:11px;color:var(--deb)}
@media (min-width:700px){.g{min-height:104px}.g .pz{font-size:13px}}
/* il giorno, come il planner */
.giorno-testa{display:flex;align-items:center;gap:8px;margin:12px 0 8px}
.giorno-testa h2{flex:1;font-size:17px;margin:0;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.giorno-testa small{color:var(--ogg);margin-left:6px}
.griglia-fuori{overflow:auto;border:1px solid var(--li);border-radius:10px;background:var(--sc);
  max-height:calc(100vh - var(--alto,58px) - 165px);max-height:calc(100dvh - var(--alto,58px) - 165px);-webkit-overflow-scrolling:touch}
.griglia{display:grid;position:relative;min-width:100%}
.col-testa{position:sticky;top:0;z-index:3;background:var(--sc);border-bottom:1px solid var(--li);padding:6px 4px;
  font-weight:700;font-size:13px;text-align:center;line-height:1.2}
.col-testa .deb{font-size:12px;font-weight:400}
.ore{position:sticky;left:0;z-index:2;background:var(--sc);border-right:1px solid var(--li)}
.angolo{left:0;z-index:4}
.ore div{position:absolute;right:4px;font-size:12px;color:var(--deb);transform:translateY(-50%)}
.col{position:relative;border-right:1px solid var(--li)}
.riga-ora{position:absolute;left:0;right:0;border-top:1px solid var(--ora)}
.blocco{position:absolute;left:3px;right:3px;border-radius:6px;padding:3px 5px;font-size:13px;line-height:1.2;overflow:hidden;
  cursor:pointer;border:1px solid rgba(0,0,0,.25);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.blocco b{display:block;font-size:13px}
.blocco.dc{outline:2px dashed var(--gi);outline-offset:-2px}
/* servizi che si sovrappongono (stesso mezzo o stesso autista): lampeggiano, come chiesto da Moreno il 7/11 */
.sovr{box-shadow:0 0 0 3px var(--ro)!important;animation:lampeggia 1s steps(2,start) infinite}
@keyframes lampeggia{50%{opacity:.3}}
@media (prefers-reduced-motion:reduce){.sovr{animation:none}}
.adesso{position:absolute;left:0;right:0;border-top:2px solid var(--ro);z-index:1}
.sotto p{margin:6px 0;color:var(--deb);font-size:14px}
/* l'elenco dei servizi sotto la griglia: si vedono tutti anche se la griglia ne mostra solo una parte (7/11) */
.elenco h3{font-size:15px;margin:14px 0 4px}
.elenco button{display:block;width:100%;text-align:left;background:var(--sc);border:1px solid var(--li);border-left-width:8px;
  border-radius:8px;padding:8px 10px;margin:6px 0;font-size:15px;line-height:1.3;cursor:pointer}
/* la scheda del servizio */
#velo{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
#velo.su{display:flex}
#scheda{background:var(--sc);width:100%;max-width:560px;max-height:88vh;overflow:auto;border-radius:16px 16px 0 0;
  padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
@media (min-width:700px){#velo{align-items:center}#scheda{border-radius:16px}}
#scheda h3{margin:0 0 4px;font-size:18px}
.chip{display:inline-block;background:var(--gi);color:#000;border-radius:6px;padding:0 6px;font-size:12px;font-weight:700;margin-right:4px}
.tp{margin-top:10px;padding:8px 0 0 10px;border-left:3px solid var(--li)}
.tp .q{font-weight:700}
.tel{display:inline-block;margin-top:6px;color:var(--ve);font-weight:800;text-decoration:none;font-size:17px}
.prezzo{margin-top:12px;font-weight:800;font-size:16px}
.nascosto{display:none!important}
/* 8/11/2026 (biglietto n. 2): i dati non sono di oggi */
.vecchi{background:var(--gi);color:#000;font-weight:700;border-radius:8px;padding:6px 10px;font-size:15px;flex-basis:100%;order:4}
/* PER MEZZO / PER AUTISTA (8/11/2026, Isa: «come nel programma va visto sia lato VAN che lato AUTISTA») */
.vista{display:inline-flex;border:1px solid var(--li);border-radius:8px;overflow:hidden;margin:8px 0}
.vista button{border:0;background:transparent;padding:7px 12px;font-size:13px;font-weight:700;cursor:pointer;color:var(--deb)}
.vista button.su{background:var(--ac);color:#fff}
.col.assente{background:repeating-linear-gradient(135deg,transparent 0 8px,var(--ora) 8px 10px)}
.col-testa .ass{color:var(--ro);font-size:12px;font-weight:700}
/* i CONTI (8/11/2026, Isa: «così il boss vede anche da fuori dare e avere e conti e tutto quello che riguarda i soldi») */
.riquadri{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
@media (min-width:700px){.riquadri{grid-template-columns:repeat(4,1fr)}}
.rq{background:var(--sc);border:1px solid var(--li);border-radius:10px;padding:8px 10px}
.rq .t{font-size:13px;color:var(--deb)}
.rq .v{font-size:18px;font-weight:800;margin-top:2px}
.rq .v.ro{color:var(--ro)}
.tab-fuori{overflow-x:auto;border:1px solid var(--li);border-radius:10px;background:var(--sc)}
table.tab{border-collapse:collapse;font-size:14px;min-width:100%}
table.tab th,table.tab td{padding:6px 8px;border-bottom:1px solid var(--li);white-space:nowrap;text-align:right}
table.tab th:first-child,table.tab td:first-child{text-align:left}
table.tab td.testo{text-align:left;white-space:normal;min-width:180px}
.conti h3{font-size:15px;margin:16px 0 6px}
.riga-aut{display:flex;justify-content:space-between;gap:8px;width:100%;text-align:left;background:var(--sc);border:1px solid var(--li);
  border-radius:8px;padding:9px 10px;margin:6px 0;font-size:15px;cursor:pointer}
.riga-aut .s{font-weight:800}
.ro{color:var(--ro)}
.soldi{margin-top:12px;padding-top:8px;border-top:1px solid var(--li)}
/* il MENU, la prima pagina (8/11/2026, Isa: «una pagina (la prima) con i pulsanti e premendo si entra nei vari reparti»,
   come la pagina del telefono di Excalibur) */
.menu{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;max-width:640px;margin:16px auto}
@media (min-width:560px){.menu{grid-template-columns:repeat(3,1fr)}}
.menu button{background:var(--sc);border:1px solid var(--li);border-radius:14px;padding:14px 8px;min-height:116px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center}
.menu button.rosso{border:2px solid var(--ro)}
.menu .em{font-size:32px;line-height:1.1}
.menu .nm{font-weight:800;font-size:16px;color:var(--ac)}
.menu .qt{font-size:13px;color:var(--deb)}
.menu .qt.ro{color:var(--ro);font-weight:700}
.avv h3,.cerca h3{font-size:15px;margin:16px 0 6px}
.avv p.a{margin:6px 0;padding:8px 10px;background:var(--sc);border:1px solid var(--li);border-left:6px solid var(--li);border-radius:8px;font-size:15px}
.avv p.a.urg{border-left-color:var(--ro)}
.cerca input{width:100%;font-size:17px;padding:10px 12px;border:1px solid var(--li);border-radius:10px;background:var(--sc);color:var(--tx)}
</style>
</head>
<body>
<header>
  <button class="b gr nascosto" id="amenu" type="button">◀ MENU</button>
  <h1 id="titolo">M Gest</h1>
  <button class="b nascosto" id="agg" type="button">AGGIORNA</button>
  <button class="b gr nascosto" id="esci" type="button">ESCI</button>
  <div class="deb" id="sotto">solo da guardare</div>
  <div id="vecchi" class="vecchi nascosto" role="status"></div>
</header>
<main>
  <div id="porta" class="nascosto">
    <p>Scrivi il PIN per vedere il programma.</p>
    <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN">
    <label class="deb"><input type="checkbox" id="ricorda" checked> Ricordami su questo dispositivo per 30 giorni</label>
    <button class="b" id="entra" type="button">ENTRA</button>
    <p id="msg" class="err"></p>
  </div>
  <p id="carica" class="deb" style="margin-top:24px">Un momento…</p>
  <div id="vista"></div>
</main>
<div id="velo"><div id="scheda" role="dialog" aria-modal="true"></div></div>
<script>
"use strict";
var CHIAVE_G = "mgest_gettone", CHIAVE_S = "mgest_script", OGNI = 10 * 60 * 1000;
var pinMem = "", dati = null, perId = {}, giornoAperto = null, timer = null;
// 8/11/2026 (Isa): la prima pagina è il MENU; il reparto aperto: menu, cal (calendario), conti, avvisi, cerca.
// Il giorno (giornoAperto) si apre dal calendario o dal menu (OGGI, DOMANI) e il suo «◀» torna lì.
var reparto = "menu", pc = 0, cercaTesto = "", primoOrario = {};   // pc = il periodo dei CONTI (0 = questo mese)
var NOMI = {menu: "MENU", cal: "CALENDARIO", conti: "CONTI", avvisi: "AVVISI", cerca: "CERCA"};
var perAutista = leggi("mgest_vista") === "autista";  // PER MEZZO (di partenza) o PER AUTISTA, ricordato sul telefono
function $(i) { return document.getElementById(i); }
function e(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
  return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]; }); }
function leggi(k) { try { return localStorage.getItem(k) || ""; } catch (x) { return ""; } }
function scrivi(k, v) { try { v ? localStorage.setItem(k, v) : localStorage.removeItem(k); } catch (x) {} }
// 9/11/2026: ogni passo nella cronologia ha il suo numero (p): «◀ MENU» in alto torna indietro di tutti i passi in un colpo,
// così poi il tasto «indietro» del telefono dal menu esce, come prima
function passi() { return (history.state && history.state.p) || 0; }
function spingi(st) { st.p = passi() + 1; history.pushState(st, ""); }
function rimpiazza(st) { st.p = passi(); history.replaceState(st, ""); }
/** «◀ MENU» in alto: si vede dappertutto tranne che nel menu. */
function pulsanteMenu() {
  $("amenu").classList.toggle("nascosto", !dati || (reparto === "menu" && !giornoAperto));
  document.documentElement.style.setProperty("--alto", document.querySelector("header").offsetHeight + "px");
}

// ── dove sta lo script: dopo il # del link (mai nel codice pubblico) ─────────────────────────────────────────────
function indirizzo() {
  var h = decodeURIComponent((location.hash || "").replace(/^#/, "").split("&")[0]);
  if (/^[A-Za-z0-9_-]{20,}$/.test(h)) { scrivi(CHIAVE_S, h); }
  else if (/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\//.test(h)) { return h; }      // solo per le prove sul PC
  var id = leggi(CHIAVE_S);
  return id ? "https://script.google.com/macros/s/" + id + "/exec" : "";
}

function chiedi(corpo) {
  var url = indirizzo();
  if (!url) return Promise.reject(new Error("Il link è incompleto: apri il link intero che ti hanno mandato (con il # e il codice dopo)."));
  // testo semplice, senza cookie: niente «/u/2/» di Google e niente controllo in più del browser
  return fetch(url, {method: "POST", body: JSON.stringify(corpo), credentials: "omit", redirect: "follow", cache: "no-store"})
    .then(function (r) { if (!r.ok) throw new Error("Google ha risposto " + r.status); return r.json(); });
}

// ── l'ingresso ──────────────────────────────────────────────────────────────────────────────────────────────
function mostraPorta(msg) {
  $("carica").classList.add("nascosto"); $("vista").innerHTML = ""; chiudiScheda(true);
  $("agg").classList.add("nascosto"); $("esci").classList.add("nascosto"); $("amenu").classList.add("nascosto");
  $("vecchi").classList.add("nascosto");
  $("porta").classList.remove("nascosto"); $("msg").textContent = msg || ""; $("pin").focus();
}
function risposta(r) {
  if (r.errore) { if (r.pin) scrivi(CHIAVE_G, ""); if (!dati || r.pin) { pinMem = ""; mostraPorta(r.errore); } else avviso(r.errore); return; }
  if (r.gettone) scrivi(CHIAVE_G, r.gettone);
  dati = JSON.parse(r.dati); perId = {};
  dati.servizi.forEach(function (s) { perId[s.id] = s; });
  primoOrario = {};                                               // l'orario del primo giorno, per le liste di AVVISI e CERCA
  dati.giorni.forEach(function (g) { g.servizi.forEach(function (sv) { if (!(sv[0] in primoOrario)) primoOrario[sv[0]] = sv[1]; }); });
  $("porta").classList.add("nascosto"); $("carica").classList.add("nascosto");
  $("agg").classList.remove("nascosto"); $("esci").classList.remove("nascosto");
  if (!dati.conti && reparto === "conti") reparto = "menu";        // dati di un M Gest più vecchio: niente CONTI
  $("titolo").textContent = dati.ditta || "M Gest";
  $("sotto").textContent = "aggiornata alle " + dati.aggiornata + " · solo da guardare";
  controllaGiorno();
  disegna();
}
/** 8/11/2026 (biglietto n. 2 di Moreno): se l'ultimo invio non è di oggi, una striscia gialla in cima. Si guarda solo il
 *  GIORNO: M Gest manda solo quando i dati cambiano, quindi un'ora vecchia non vuol dire che qualcosa non va. */
function controllaGiorno() {
  var m = /^(\d{2})\/(\d{2})\/(\d{4})/.exec((dati && dati.aggiornata) || ""), v = $("vecchi");
  var oggi = new Date(), dIt = ("0" + oggi.getDate()).slice(-2) + "/" + ("0" + (oggi.getMonth() + 1)).slice(-2) + "/" + oggi.getFullYear();
  if (!m || m[0] === dIt) v.classList.add("nascosto");
  else { v.textContent = "Dati del " + m[1] + "/" + m[2] + ": oggi M Gest non è stato aperto"; v.classList.remove("nascosto"); }
  // la fascia in alto cambia altezza: la griglia del giorno e i giorni della settimana si sistemano sotto
  document.documentElement.style.setProperty("--alto", document.querySelector("header").offsetHeight + "px");
}
function guasto(x) { if (dati) avviso("Non riesco ad aggiornare: " + (x && x.message || x)); else mostraPorta("Non riesco a parlare con Google: " + (x && x.message || x)); }
function avviso(t) { $("sotto").textContent = t; }
function aggiorna() {
  var g = leggi(CHIAVE_G);
  if (!dati) $("carica").classList.remove("nascosto");
  if (g) return chiedi({azione: "gettone", gettone: g}).then(risposta, guasto);
  if (pinMem) return chiedi({azione: "entra", pin: pinMem, ricordami: false}).then(risposta, guasto);
  mostraPorta("");
}
$("entra").onclick = function () {
  var p = $("pin").value.trim(); if (!p) return;
  $("pin").value = ""; pinMem = p; $("msg").textContent = ""; $("carica").classList.remove("nascosto");
  chiedi({azione: "entra", pin: p, ricordami: $("ricorda").checked}).then(function (r) { if (r.errore) pinMem = ""; risposta(r); }, guasto);
};
$("pin").onkeydown = function (ev) { if (ev.key === "Enter") $("entra").onclick(); };
$("agg").onclick = function () { avviso("Aggiorno…"); aggiorna(); };
$("amenu").onclick = function () {
  var n = passi();
  if (n > 0) return history.go(-n);                  // il «popstate» disegna il menu e chiude la scheda
  reparto = "menu"; giornoAperto = null; chiudiScheda(); disegna(); window.scrollTo(0, 0);
};
$("esci").onclick = function () {
  var g = leggi(CHIAVE_G); scrivi(CHIAVE_G, ""); pinMem = ""; dati = null; giornoAperto = null; reparto = "menu"; cercaTesto = "";
  if (g) chiedi({azione: "esci", gettone: g}).catch(function () {});
  history.replaceState({}, "", location.pathname + location.search + location.hash);
  mostraPorta("Uscito.");
};

// ── date ────────────────────────────────────────────────────────────────────────────────────────────────────
var GG = ["dom", "lun", "mar", "mer", "gio", "ven", "sab"];
var GGL = ["domenica", "lunedì", "martedì", "mercoledì", "giovedì", "venerdì", "sabato"];
var MM = ["gennaio", "febbraio", "marzo", "aprile", "maggio", "giugno", "luglio", "agosto", "settembre", "ottobre", "novembre", "dicembre"];
function d(iso) { return new Date(iso.slice(0, 10) + "T12:00:00"); }
function iso(x) { return x.getFullYear() + "-" + ("0" + (x.getMonth() + 1)).slice(-2) + "-" + ("0" + x.getDate()).slice(-2); }
function piu(x, n) { var y = new Date(x.getTime()); y.setDate(y.getDate() + n); return y; }
function oggiIso() { return iso(new Date()); }
function minuti(t) { return Number(t.slice(11, 13)) * 60 + Number(t.slice(14, 16)); }
function euro(v) {        // «2.070,00 €» come nel programma (8/11: in italiano 4 cifre di solito non hanno il punto)
  return Number(v).toLocaleString("it-IT", {minimumFractionDigits: 2, maximumFractionDigits: 2, useGrouping: "always"}) + " €";
}
function testoSu(c) {
  var m = /^#?([0-9a-f]{6})$/i.exec(c || ""); if (!m) return "#000";
  var n = parseInt(m[1], 16), r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  return (0.299 * r + 0.587 * g + 0.114 * b) > 150 ? "#000" : "#fff";
}
function colore(s) { return /^#[0-9a-f]{6}$/i.test(s.colore || "") ? s.colore : "#FFFFFF"; }
/** Il colore del servizio come nel planner: PER MEZZO quello dell'autista, PER AUTISTA quello del mezzo. */
function coloreVista(s) {
  if (!perAutista) return colore(s);
  return /^#[0-9a-f]{6}$/i.test(s.colore_mezzo || "") ? s.colore_mezzo : "#FFFFFF";
}
function chiaveAutista(s) { return s.autista_id != null ? s.autista_id : (s.autista ? "n:" + s.autista : "da"); }

      if (a.inizio > b.inizio) { var t = a; a = b; b = t; }
      var k = a.id + "-" + b.id; if (viste[k]) continue; viste[k] = true;
      out.push({giorno: g.giorno, a: a, b: b, perche: [mezzo ? "stesso mezzo " + a.mezzo : "", autista ? "stesso autista " + a.autista : ""].filter(Boolean).join(" e ")});
    }
  });
  return out;
}
function disegnaMenu() {
  var oi = oggiIso(), dm = iso(piu(d(oi), 1));
  function quanti(g) { var n = g ? g.servizi.length : null; return n == null ? "fuori dai giorni" : n === 0 ? "nessun servizio" : n === 1 ? "1 servizio" : n + " servizi"; }
  var av = (dati.avvisi || []).length, urg = urgenti(), sa = senzaAutista().length, sv = coppieSovrapposte().length;
  var righe = [];
  if (av) righe.push(av + (av === 1 ? " avviso" : " avvisi") + (urg ? " · " + urg + (urg === 1 ? " urgente" : " urgenti") : ""));
  if (sv) righe.push(sv + (sv === 1 ? " sovrapposto" : " sovrapposti"));
  if (sa) righe.push(sa + " senza autista");
  var qtAvv = righe.length ? righe.join("<br>") : "niente da sistemare";
  urg = urg || sv;                                                // un turno sovrapposto è urgente come una scadenza passata
  var g0 = dati.giorni[0].giorno, g1 = dati.giorni[dati.giorni.length - 1].giorno;
  var p = [["oggi", "🚐", "OGGI", quanti(giornoDi(oi)), ""],
           ["domani", "📆", "DOMANI", quanti(giornoDi(dm)), ""],
           ["cal", "📅", "CALENDARIO", "dal " + giornoIt(g0).slice(0, 5) + " al " + giornoIt(g1).slice(0, 5), ""],
           ["avvisi", "⚠️", "AVVISI", qtAvv, urg || sa ? "ro" : ""]];
  if (dati.conti) p.push(["conti", "💶", "CONTI", "incassi, spese, autisti", ""]);
  p.push(["cerca", "🔍", "CERCA", "cliente, telefono, posto", ""]);
  $("vista").innerHTML = '<div class="menu">' + p.map(function (x) {
    return '<button type="button" data-r="' + x[0] + '"' + (x[0] === "avvisi" && urg ? ' class="rosso"' : "") + '><span class="em" aria-hidden="true">' + x[1] +
      '</span><span class="nm">' + x[2] + '</span><span class="qt' + (x[4] ? " " + x[4] : "") + '">' + x[3] + "</span></button>";
  }).join("") + "</div>";
  Array.prototype.forEach.call(document.querySelectorAll(".menu button"), function (b) {
    b.onclick = function () {
      var r = b.getAttribute("data-r");
      if (r !== "oggi" && r !== "domani") return vai(r);
      var gi = r === "oggi" ? oi : dm;
      if (giornoDi(gi)) apriGiorno(gi); else avviso("Questo giorno non è nella pagina: i dati sono vecchi, apri M Gest.");
    };
  });
}
/** Una riga cliccabile di un servizio (AVVISI, CERCA): giorno e ora, mezzo, autista, cliente o percorso. */
function rigaServizio(s, bordo) {
  var o = primoOrario[s.id] || "", x = d(s.inizio);
  return '<button type="button" data-s="' + s.id + '" data-o="' + e(o) + '" style="border-left-color:' + (bordo || coloreVista(s)) + '"><b>' +
    GG[x.getDay()] + " " + giornoIt(s.inizio).slice(0, 5) + " " + e(o) + "</b> · " + e(s.da_assegnare ? "da assegnare" : s.mezzo) + " · " +
    e(s.autista || "senza autista") + (riassunto(s) ? "<br>" + e(riassunto(s)) : "") + "</button>";
}
function legaRighe() {
  Array.prototype.forEach.call(document.querySelectorAll("#vista .elenco button[data-s]"), function (b) {
    b.onclick = function () { apriScheda(Number(b.getAttribute("data-s")), b.getAttribute("data-o")); };
  });
}

// ── AVVISI: quelli di M Gest (scadenze, multe, ferie e fermi, da confermare, senza mezzo, senza km, richieste) e i
// servizi dei prossimi 7 giorni ancora senza autista ─────────────────────────────────────────────────────────────
function disegnaAvvisi() {
  var av = (dati.avvisi || []).slice().sort(function (p, q) { return (q.urgente ? 1 : 0) - (p.urgente ? 1 : 0); }), sa = senzaAutista();
  var h = '<div class="avv"><div class="giorno-testa"><h2>Avvisi</h2></div>';
  h += "<h3>Da sistemare in M Gest" + (av.length ? " (" + av.length + ")" : "") + "</h3>";
  h += av.length ? av.map(function (a) {
    return '<p class="a' + (a.urgente ? " urg" : "") + '">' + (a.urgente ? '<b class="ro">URGENTE</b> · ' : "") + e(a.testo) + "</p>"; }).join("")
    : '<p class="deb">Nessun avviso.</p>';
  h += '<p class="deb">Scadenze di mezzi e autisti, multe, ferie e fermi, servizi da confermare o senza mezzo, richieste dei clienti: ' +
    "come gli AVVISI di M Gest. Si segnano «fatto» o si rimandano solo in M Gest.</p>";
  var cs = coppieSovrapposte();
  h += "<h3>Turni sovrapposti — da oggi a 7 giorni" + (cs.length ? " (" + cs.length + ")" : "") + "</h3>";
  h += cs.length ? '<div class="elenco">' + cs.map(function (c) {
    var x = d(c.giorno), oa = primoOrario[c.a.id] || "", ob = primoOrario[c.b.id] || "";
    return '<button type="button" class="sovr" data-g="' + c.giorno + '" style="border-left-color:var(--ro)"><b>' + GG[x.getDay()] + " " +
      giornoIt(c.giorno).slice(0, 5) + "</b> · " + e(c.perche) + "<br>" + e(oa) + " " + e(riassunto(c.a)) + "<br>" + e(ob) + " " + e(riassunto(c.b)) + "</button>";
  }).join("") + '</div><p class="deb">Tocca per aprire il giorno. Si sistemano in M Gest.</p>'
    : '<p class="deb">Nessun turno sovrapposto.</p>';
  h += "<h3>Senza autista — prossimi 7 giorni" + (sa.length ? " (" + sa.length + ")" : "") + "</h3>";
  h += sa.length ? '<div class="elenco">' + sa.map(function (s) { return rigaServizio(s, "var(--ro)"); }).join("") + "</div>"
    : '<p class="deb">Tutti i servizi dei prossimi 7 giorni hanno l\'autista.</p>';
  $("vista").innerHTML = h + "</div>";
  legaRighe();
  Array.prototype.forEach.call(document.querySelectorAll(".avv .elenco button[data-g]"), function (b) {
    b.onclick = function () { apriGiorno(b.getAttribute("data-g")); };
  });
}

// ── CERCA: nei servizi della pagina, per cliente, telefono, posto, volo, mezzo, targa, autista, evento ──────────────
function normale(t) { return String(t == null ? "" : t).toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, ""); }
function disegnaCerca() {
  if (!$("cerca-in")) {           // la casella si fa una volta sola: aggiornando i dati non si chiude la tastiera
    var g0 = dati.giorni[0].giorno, g1 = dati.giorni[dati.giorni.length - 1].giorno;
    $("vista").innerHTML = '<div class="cerca"><div class="giorno-testa"><h2>Cerca</h2></div>' +
      '<input id="cerca-in" type="search" placeholder="Cliente, telefono, posto, volo…" autocomplete="off" aria-label="Cerca">' +
      '<p class="deb">Nei servizi dal ' + giornoIt(g0) + " al " + giornoIt(g1) + '.</p><div id="trovati"></div></div>';
    $("cerca-in").value = cercaTesto;
    $("cerca-in").oninput = function () { cercaTesto = $("cerca-in").value; trova(); };
  }
  trova();
}
function trova() {
  var out = $("trovati"); if (!out) return;
  var q = normale(cercaTesto).trim(), cifre = q.replace(/[^0-9]/g, "");
  if (q.length < 2) { out.innerHTML = '<p class="deb">Scrivi almeno 2 lettere.</p>'; return; }
  var parole = q.split(/\s+/);
  var ss = dati.servizi.filter(function (s) {
    var testo = normale([s.mezzo, s.targa, s.autista, s.evento].concat(s.tappe.map(function (t) {
      return [t.cliente, t.da, t.a, t.volo, t.telefono].join(" "); })).join(" "));
    var tel = s.tappe.map(function (t) { return String(t.telefono || "").replace(/[^0-9]/g, ""); }).join(" ");
    return parole.every(function (p) { return testo.indexOf(p) >= 0; }) || (cifre.length >= 4 && tel.indexOf(cifre) >= 0);
  }).sort(function (p, q) { return p.inizio < q.inizio ? -1 : p.inizio > q.inizio ? 1 : 0; });
  out.innerHTML = !ss.length ? '<p class="deb">Nessun servizio trovato.</p>' :
    "<h3>" + (ss.length === 1 ? "1 servizio" : ss.length + " servizi") + '</h3><div class="elenco">' + ss.map(function (s) { return rigaServizio(s); }).join("") + "</div>";
  legaRighe();
}

// ── i CONTI (8/11/2026, Isa): come CONTABILITÀ e CONTI AUTISTI di M Gest, solo da guardare ────────────────────
function eu(v) { return v == null ? "—" : euro(v); }
function rq(titolo, valore, rosso) {
  return '<div class="rq"><div class="t">' + titolo + '</div><div class="v' + (rosso ? " ro" : "") + '">' + valore + "</div></div>";
}
function giornoIt(s) { return s ? s.slice(8, 10) + "/" + s.slice(5, 7) + "/" + s.slice(0, 4) : ""; }
function disegnaConti() {
  var c = dati.conti, p = c.periodi[pc] || c.periodi[0];
  var h = '<div class="conti"><div class="giorno-testa"><h2>Conti</h2></div>';
  h += '<div class="vista" role="group" aria-label="Periodo">' + c.periodi.map(function (x, i) {
    return '<button type="button" data-p="' + i + '"' + (x === p ? ' class="su"' : "") + ">" + e(x.nome) + "</button>"; }).join("") + "</div>";
  h += '<p class="deb">Dal ' + giornoIt(p.da) + " al " + giornoIt(p.a) + ". Conti interni, come in CONTABILITÀ di M Gest: non è la contabilità fiscale.</p>";
  h += '<div class="riquadri">' +
    rq("Contanti", eu(p.contanti[0]) + " <small>(" + p.contanti[1] + ")</small>") +
    rq("POS", eu(p.pos[0]) + " <small>(" + p.pos[1] + ")</small>") +
    rq("Da incassare", eu(p.da_incassare[0]) + " <small>(" + p.da_incassare[1] + " serv.)</small>", p.da_incassare[0] > 0.004) +
    rq("Servizi ancora da fare" + (p.da_fare[2] ? " · acconti " + eu(p.da_fare[2]) : ""), p.da_fare[0] + " serv. · " + eu(p.da_fare[1])) +
    rq("Spese di viaggio", eu(p.spese)) +
    rq("Guadagno" + (p.senza_prezzo ? " (+" + p.senza_prezzo + " senza prezzo)" : ""), (p.stimato ? "≈ " : "") + eu(p.guadagno), p.guadagno < 0) +
    (p.generali ? rq("Multe e danni della ditta (senza viaggio)", eu(p.generali)) : "") +
    (p.hotel && p.hotel[1] ? rq("In conto hotel", eu(p.hotel[0]) + " <small>(" + p.hotel[1] + ")</small>") : "") + "</div>";
  if (p.per_van.length) {
    h += "<h3>Per van — i servizi già finiti</h3><div class=\"tab-fuori\"><table class=\"tab\"><tr><th>Mezzo</th><th>Servizi</th><th>Km</th>" +
      "<th>Prezzi €</th><th>Incassato €</th><th>Da incassare €</th><th>Carburante €</th><th>Spese €</th><th>€ per km</th></tr>" +
      p.per_van.map(function (v) {
        return "<tr><td>" + e(v.mezzo) + "</td><td>" + v.servizi + "</td><td>" + v.km.toLocaleString("it-IT") + "</td><td>" + eu(v.prezzi) +
          (v.senza_prezzo ? " (+" + v.senza_prezzo + " senza)" : "") + "</td><td>" + eu(v.incassato) + '</td><td class="' + (v.da_incassare > 0.004 ? "ro" : "") +
          '">' + eu(v.da_incassare) + "</td><td>" + eu(v.carburante) + "</td><td>" + eu(v.spese) + "</td><td>" + eu(v.ekm) + "</td></tr>";
      }).join("") + "</table></div>";
  }
  h += "<h3>Da incassare — servizi già finiti</h3>";
  if (!p.elenco_da_incassare.length) h += '<p class="deb">Niente da incassare in questo periodo.</p>';
  else h += '<div class="elenco">' + p.elenco_da_incassare.map(function (x) {
    return '<button type="button" data-s="' + x.id + '" data-o="' + e(x.orario) + '" style="border-left-color:var(--ro)"><b>' + giornoIt(x.giorno).slice(0, 5) + " " + e(x.orario) +
      '</b> · <span class="ro"><b>' + eu(x.resta) + "</b></span><br>" + e(x.cliente || "—") + " · " + e(x.mezzo) + " · " + e(x.autista || "senza autista") +
      '<br><span class="deb">prezzo ' + eu(x.prezzo) + " · pagato " + eu(x.pagato) + "</span></button>";
  }).join("") + "</div>";
  h += "<h3>Conti autisti — dare e avere, a oggi</h3>";
  if (!c.autisti.length) h += '<p class="deb">Nessun autista.</p>';
  else h += c.autisti.map(function (a, i) {
    var sit = a.saldo > 0.004 ? "ti deve " + euro(a.saldo) : a.saldo < -0.004 ? "gli devi " + euro(-a.saldo) : "pari";
    return '<button type="button" class="riga-aut" data-a="' + i + '"><span><b>' + e(a.nome) + '</b><br><span class="deb">dare ' + eu(a.dare) +
      " · avere " + eu(a.avere) + '</span></span><span class="s' + (a.saldo > 0.004 ? " ro" : "") + '">' + sit + "</span></button>";
  }).join("");
  h += '<p class="deb">Dare = quello che l\'autista deve alla ditta (i contanti presi dai clienti, multe e danni a suo carico). ' +
    "Avere = quello che la ditta deve a lui (carburante e spese pagati coi suoi soldi). Tocca un autista per le sue righe.</p></div>";
  $("vista").innerHTML = h;
  Array.prototype.forEach.call(document.querySelectorAll(".conti .vista button"), function (b) {
    b.onclick = function () { pc = Number(b.getAttribute("data-p")); disegnaConti(); };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".conti .elenco button"), function (b) {
    b.onclick = function () {
      var id = Number(b.getAttribute("data-s"));
      if (perId[id]) apriScheda(id, b.getAttribute("data-o"));
      else avviso("Questo servizio è fuori dai giorni della pagina: i dettagli sono in M Gest.");
    };
  });
  Array.prototype.forEach.call(document.querySelectorAll(".riga-aut"), function (b) {
    b.onclick = function () { apriEstratto(Number(b.getAttribute("data-a"))); };
  });
}
function apriEstratto(i) {
  var a = dati.conti.autisti[i]; if (!a) return;
  var sit = a.saldo > 0.004 ? "ti deve " + euro(a.saldo) : a.saldo < -0.004 ? "gli devi " + euro(-a.saldo) : "pari";
  var h = "<h3>👤 " + e(a.nome) + "</h3><div>Dare " + eu(a.dare) + " · Avere " + eu(a.avere) + "</div>" +
    '<div class="prezzo' + (a.saldo > 0.004 ? " ro" : "") + '">Saldo: ' + sit + "</div>";
  if (!a.righe.length) h += '<p class="deb">Nessuna riga.</p>';
  else {
    h += '<p class="deb">' + (a.righe_tutte > a.righe.length ? "Le ultime " + a.righe.length + " righe su " + a.righe_tutte + ", " : "") +
      "la più nuova in cima.</p><div class=\"tab-fuori\"><table class=\"tab\"><tr><th>Data</th><th>Cosa</th><th>Dare €</th><th>Avere €</th><th>Saldo €</th></tr>" +
      a.righe.map(function (r) {
        return "<tr><td>" + giornoIt(r[0]).slice(0, 5) + '</td><td class="testo">' + e(r[3]) + "</td><td>" + (r[1] === "dare" ? euro(r[2]) : "") +
          "</td><td>" + (r[1] === "avere" ? euro(r[2]) : "") + "</td><td>" + euro(r[4]) + "</td></tr>";
      }).join("") + "</table></div>";
  }
  h += '<p style="margin-top:16px"><button class="b" type="button" id="chiudi">CHIUDI</button></p>';
  $("scheda").innerHTML = h;
  $("velo").classList.add("su");
  spingi({r: "conti", a: i});
  $("chiudi").onclick = function () { history.back(); };
}

// il tasto «indietro» del telefono: scheda → giorno → calendario (o il reparto da cui si è partiti) → menu
window.addEventListener("popstate", function (ev) {
  var st = ev.state || {};
  chiudiScheda();
  if (!dati) return;
  if (st.s || st.a != null) return;                               // si chiude solo la scheda: sotto c'è già il posto giusto
  var r = st.r || "menu", g = st.g || null;
  if (r === reparto && g === giornoAperto) return;
  var daGiorno = !!giornoAperto;
  reparto = r; giornoAperto = g;
  if (g) return disegnaGiorno(g, true);
  disegna();
  window.scrollTo(0, r === "cal" && daGiorno ? disegna.scroll || 0 : 0);   // dal giorno si torna dove si era nel calendario
});
// 8/11/2026 (biglietto n. 2): si ridisegna solo se cambia la LARGHEZZA (telefono girato, finestra del PC). Su Android la barra
// di Chrome che sparisce mentre si scorre cambia solo l'altezza: prima faceva tornare la griglia in cima.
var larghezzaVista = window.innerWidth;
window.addEventListener("resize", function () {
  if (window.innerWidth === larghezzaVista) return;
  larghezzaVista = window.innerWidth;
  if (dati && giornoAperto) disegnaGiorno(giornoAperto, false);
});

// l'aggiornamento da solo ogni 10 minuti (e quando si torna sulla pagina dopo un po')
var ultimoGiro = 0;
function giro() { if (dati && !$("velo").classList.contains("su")) { ultimoGiro = Date.now(); aggiorna(); } }
setInterval(giro, OGNI);
document.addEventListener("visibilitychange", function () { if (!document.hidden && Date.now() - ultimoGiro > OGNI) giro(); });

history.replaceState({}, "");
ultimoGiro = Date.now();
if (!indirizzo()) { $("carica").classList.add("nascosto"); $("porta").classList.remove("nascosto"); $("msg").textContent = "Il link è incompleto: apri il link intero che ti hanno mandato (con il # e il codice dopo)."; }
else aggiorna();
</script>
